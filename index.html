<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>猫和老鼠大冒险</title>
<style>
  :root{--ink:#3b2a20;--cheese:#ffcf33;--bg:#fff3d6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#2b1d16;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  canvas#game{background:#000;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));image-rendering:auto;touch-action:none}
  #menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,29,22,.88);z-index:5;padding:12px;overflow:auto}
  .card{background:var(--bg);border:5px solid var(--ink);border-radius:22px;padding:20px 24px;max-width:640px;width:100%;box-shadow:0 8px 0 #0006}
  h1{margin:0 0 6px;font-size:28px;text-align:center}
  p.sub{margin:0 0 14px;text-align:center;font-size:14px;opacity:.8}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center}
  #preview{width:160px;height:160px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
  .ctl{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:200px}
  .ctl label{display:flex;flex-direction:column;gap:2px}
  input[type=text]{padding:6px 8px;border:3px solid var(--ink);border-radius:10px;font-size:15px;width:100%}
  button.big{display:block;margin:16px auto 0;background:var(--cheese);border:4px solid var(--ink);border-radius:16px;padding:10px 34px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
  button.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .file{background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:8px;font-size:14px}
  .keys{margin-top:12px;font-size:13px;text-align:center;line-height:1.6}
  #touch{position:absolute;inset:auto 0 0 0;height:140px;display:none;z-index:4;pointer-events:none}
  #touch .b{position:absolute;width:64px;height:64px;border-radius:50%;background:#fff8;border:3px solid #fffc;color:#3b2a20;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none;-webkit-user-select:none;touch-action:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="menu">
    <div class="card">
      <h1>🐭 猫和老鼠大冒险 🐱</h1>
      <p class="sub">把你的照片变成卡通小主角，穿越 3 关，打败汤姆猫，找到杰瑞的生日礼物！</p>
      <div class="row">
        <canvas id="preview" width="160" height="160"></canvas>
        <div class="ctl">
          <div class="file">📷 上传照片：<input type="file" id="file" accept="image/*"></div>
          <label>缩放 <input type="range" id="zoom" min="1" max="3" step="0.05" value="1.2"></label>
          <label>左右 <input type="range" id="ox" min="-1" max="1" step="0.05" value="0"></label>
          <label>上下 <input type="range" id="oy" min="-1" max="1" step="0.05" value="-0.4"></label>
          <label>名字 <input type="text" id="name" value="KK" maxlength="8"></label>
        </div>
      </div>
      <button class="big" id="start">开始冒险 ▶</button>
      <div class="keys">
        <b>← →</b> 移动　<b>↑ ↓</b> 爬梯子　<b>空格</b> 跳跃　<b>↓+空格</b> 从平台跳下<br>
        <b>Z / J</b> 丢奶酪派攻击　<b>踩在猫头上</b>也能打败它！　<b>Enter</b> 继续/重试
      </div>
    </div>
  </div>

  <div id="touch">
    <div class="b" data-k="left"  style="left:12px;bottom:14px">◀</div>
    <div class="b" data-k="right" style="left:88px;bottom:14px">▶</div>
    <div class="b" data-k="up"    style="left:50px;bottom:78px">▲</div>
    <div class="b" data-k="down"  style="left:50px;bottom:-50px;display:none">▼</div>
    <div class="b" data-k="atk"   style="right:90px;bottom:14px">🧀</div>
    <div class="b" data-k="jump"  style="right:14px;bottom:50px">⤒</div>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 480;
const $ = id => document.getElementById(id);

/* ================= 音效 ================= */
let ac = null;
function beep(f, d = .1, type = 'square', v = .06, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, ac.currentTime + d);
    g.gain.value = v; g.gain.linearRampToValueAtTime(0, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const sfx = {
  jump: () => beep(380, .15, 'square', .05, 300),
  coin: () => { beep(880, .08, 'triangle', .07); setTimeout(() => beep(1320, .1, 'triangle', .07), 70); },
  hit: () => beep(160, .25, 'sawtooth', .08, -100),
  throw: () => beep(600, .08, 'square', .04, -300),
  kill: () => beep(300, .2, 'square', .07, 400),
  win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .08), i * 130)),
};

/* ================= 照片 -> 卡通头像 ================= */
let srcImg = null, headCv = null;

function cartoonize(img, zoom, ox, oy) {
  const S = 160;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#ffd9b3'; g.fillRect(0, 0, S, S);
  if (img) {
    const side = Math.min(img.width, img.height) / zoom;
    const sx = (img.width - side) / 2 * (1 + ox), sy = (img.height - side) / 2 * (1 + oy);
    g.drawImage(img, sx, sy, side, side, 0, 0, S, S);
    try {
      const id = g.getImageData(0, 0, S, S), d = id.data;
      // 1. 平滑（多次盒式模糊，去掉皮肤纹理）
      let a = new Float32Array(S * S * 3);
      for (let i = 0; i < S * S; i++) { a[i*3] = d[i*4]; a[i*3+1] = d[i*4+1]; a[i*3+2] = d[i*4+2]; }
      a = boxBlur(a, S, 3, 3);
      // 2. 亮度（用于边缘）
      const lum = new Float32Array(S * S);
      for (let i = 0; i < S * S; i++) lum[i] = .3 * a[i*3] + .59 * a[i*3+1] + .11 * a[i*3+2];
      // 3. 提高饱和度 + 色阶分层（赛璐璐风格）
      const L = 6;
      for (let i = 0; i < S * S; i++) {
        const gray = lum[i];
        for (let k = 0; k < 3; k++) {
          let v = gray + (a[i*3+k] - gray) * 1.45;
          v = (v - 128) * 1.12 + 128;
          v = Math.max(0, Math.min(255, v));
          d[i*4+k] = Math.round(v / 255 * (L - 1)) / (L - 1) * 255;
        }
        d[i*4+3] = 255;
      }
      // 4. Sobel 描边
      const sm = boxBlur(lum, S, 1, 1, 1);
      for (let y = 1; y < S - 1; y++) for (let x = 1; x < S - 1; x++) {
        const p = y * S + x;
        const gx = -sm[p-S-1] - 2*sm[p-1] - sm[p+S-1] + sm[p-S+1] + 2*sm[p+1] + sm[p+S+1];
        const gy = -sm[p-S-1] - 2*sm[p-S] - sm[p-S+1] + sm[p+S-1] + 2*sm[p+S] + sm[p+S+1];
        const m = Math.sqrt(gx*gx + gy*gy);
        if (m > 70) {
          const t = Math.min(1, (m - 70) / 60);
          for (let k = 0; k < 3; k++) d[p*4+k] = d[p*4+k] * (1 - t) + 35 * t;
        }
      }
      g.putImageData(id, 0, 0);
    } catch (e) { /* 跨域等情况：保留原图 */ }
  } else {
    drawDefaultFace(g, S);
  }
  // 圆形裁切 + 粗描边 + 高光
  const out = document.createElement('canvas'); out.width = out.height = S;
  const o = out.getContext('2d');
  o.save(); o.beginPath(); o.arc(S/2, S/2, S/2 - 6, 0, 7); o.clip(); o.drawImage(c, 0, 0); o.restore();
  o.lineWidth = 9; o.strokeStyle = '#2b1d16'; o.beginPath(); o.arc(S/2, S/2, S/2 - 5, 0, 7); o.stroke();
  o.strokeStyle = 'rgba(255,255,255,.55)'; o.lineWidth = 5; o.lineCap = 'round';
  o.beginPath(); o.arc(S/2, S/2, S/2 - 18, Math.PI * 1.08, Math.PI * 1.42); o.stroke();
  return out;
}
function boxBlur(src, S, r, passes, ch = 3) {
  let a = src, b = new Float32Array(a.length);
  for (let n = 0; n < passes; n++) {
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) for (let k = 0; k < ch; k++) {
      let s = 0, c = 0;
      for (let dx = -r; dx <= r; dx++) { const xx = x + dx; if (xx >= 0 && xx < S) { s += a[(y*S+xx)*ch+k]; c++; } }
      b[(y*S+x)*ch+k] = s / c;
    }
    const t = a; a = b; b = (t === src) ? new Float32Array(a.length) : t;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) for (let k = 0; k < ch; k++) {
      let s = 0, c = 0;
      for (let dy = -r; dy <= r; dy++) { const yy = y + dy; if (yy >= 0 && yy < S) { s += a[(yy*S+x)*ch+k]; c++; } }
      b[(y*S+x)*ch+k] = s / c;
    }
    const t2 = a; a = b; b = t2;
  }
  return a;
}
function drawDefaultFace(g, S) {
  g.fillStyle = '#bfe6ff'; g.fillRect(0, 0, S, S);
  g.fillStyle = '#ffd2a8'; g.beginPath(); g.ellipse(S/2, S/2 + 6, 56, 60, 0, 0, 7); g.fill();
  g.fillStyle = '#4a2f1f'; g.beginPath(); g.ellipse(S/2, 42, 62, 34, 0, Math.PI, 0); g.fill();
  g.fillRect(18, 40, 124, 14);
  g.fillStyle = '#2b1d16';
  g.beginPath(); g.arc(58, 84, 8, 0, 7); g.arc(102, 84, 8, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(61, 81, 3, 0, 7); g.arc(105, 81, 3, 0, 7); g.fill();
  g.strokeStyle = '#2b1d16'; g.lineWidth = 5; g.lineCap = 'round';
  g.beginPath(); g.arc(80, 100, 22, .2, Math.PI - .2); g.stroke();
  g.fillStyle = 'rgba(255,120,120,.5)'; g.beginPath(); g.arc(40, 104, 10, 0, 7); g.arc(120, 104, 10, 0, 7); g.fill();
}
function refreshHead() {
  headCv = cartoonize(srcImg, +$('zoom').value, +$('ox').value, +$('oy').value);
  const p = $('preview').getContext('2d'); p.clearRect(0, 0, 160, 160); p.drawImage(headCv, 0, 0);
}
['zoom', 'ox', 'oy'].forEach(id => $(id).addEventListener('input', refreshHead));
$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => { srcImg = im; refreshHead(); }; im.src = fr.result; };
  fr.readAsDataURL(f);
});
// 如果仓库里放了照片（kid.jpg 等），自动载入
(function autoLoad() {
  const names = ['kid', 'photo', 'me', 'kk', 'KK', 'child', 'baby', 'avatar'], exts = ['jpg', 'jpeg', 'png', 'webp'];
  const list = []; names.forEach(n => exts.forEach(x => list.push(n + '.' + x)));
  (function next() {
    if (!list.length) return;
    const im = new Image(); const f = list.shift();
    im.onload = () => { srcImg = im; refreshHead(); };
    im.onerror = next; im.src = f;
  })();
})();
refreshHead();

/* ================= 关卡数据 ================= */
// 平台 plat(x,y,w)；梯子 lad(x,top,bot)；猫 cat(x,y,a,b,hp,boss)；奶酪 [x,y]
const plat = (x, y, w) => ({ x, y, w });
const lad = (x, top, bot) => ({ x, top, bot });
const gseg = (a, b) => ({ x: a, y: GROUND, w: b - a, ground: true });

const LEVELS = [
  { name: '第 1 关 · 后花园', width: 3400, sky: ['#8fd3ff', '#e6f7ff'], theme: 'garden',
    ground: [gseg(0, 1200), gseg(1320, 2300), gseg(2420, 3400)],
    plats: [plat(300,370,220), plat(600,270,240), plat(900,370,200), plat(1450,370,220), plat(1760,270,240), plat(2020,370,200), plat(2640,370,220), plat(2920,270,240)],
    ladders: [lad(340,370,GROUND), lad(640,270,GROUND), lad(940,370,GROUND), lad(1490,370,GROUND), lad(1800,270,GROUND), lad(2060,370,GROUND), lad(2680,370,GROUND), lad(2960,270,GROUND)],
    cats: [[700,GROUND,500,1000,2], [1600,GROUND,1350,1900,2], [2000,GROUND,1800,2250,2], [2800,GROUND,2500,3150,2], [1800,270,1770,1980,1], [2960,270,2930,3140,1]],
    cheese: [[360,330],[420,330],[660,230],[730,230],[800,230],[960,330],[1010,330],[400,440],[1100,440],[1500,330],[1560,330],[1820,230],[1890,230],[2070,330],[2150,440],[2700,330],[2760,330],[2980,230],[3050,230],[3120,230]],
    hearts: [[1800,230]], goal: 3300 },
  { name: '第 2 关 · 厨房冒险', width: 3800, sky: ['#ffe2a8', '#fff6e0'], theme: 'kitchen',
    ground: [gseg(0, 900), gseg(1030, 1800), gseg(1940, 2600), gseg(2740, 3800)],
    plats: [plat(250,370,200), plat(520,270,220), plat(760,370,180), plat(1200,380,200), plat(1500,280,220), plat(1860,330,160), plat(2200,370,220), plat(2480,270,200), plat(2860,370,220), plat(3160,270,240)],
    ladders: [lad(290,370,GROUND), lad(560,270,GROUND), lad(800,370,GROUND), lad(1240,380,GROUND), lad(1540,280,GROUND), lad(2240,370,GROUND), lad(2520,270,GROUND), lad(2900,370,GROUND), lad(3200,270,GROUND)],
    cats: [[500,GROUND,300,880,2], [1300,GROUND,1050,1780,2], [1600,GROUND,1050,1780,2], [2100,GROUND,1960,2580,2], [2300,GROUND,1960,2580,2], [3000,GROUND,2760,3200,2], [3500,GROUND,3250,3780,2], [1500,280,1500,1720,1], [3160,270,3160,3400,1]],
    cheese: [[300,330],[360,330],[560,230],[620,230],[800,330],[960,440],[1240,340],[1300,340],[1540,240],[1620,240],[1900,290],[1990,440],[2240,330],[2300,330],[2520,230],[2580,230],[2900,330],[2960,330],[3200,230],[3270,230],[3340,230]],
    hearts: [[1580,240],[3260,230]], goal: 3700 },
  { name: '第 3 关 · 汤姆的生日派对', width: 3200, sky: ['#2b2a5e', '#8a5fb8'], theme: 'party',
    ground: [gseg(0, 1000), gseg(1150, 2000), gseg(2150, 3200)],
    plats: [plat(300,370,220), plat(580,270,220), plat(860,370,160), plat(1250,370,200), plat(1540,270,240), plat(1800,370,160), plat(2300,370,200)],
    ladders: [lad(340,370,GROUND), lad(620,270,GROUND), lad(900,370,GROUND), lad(1290,370,GROUND), lad(1580,270,GROUND), lad(1840,370,GROUND), lad(2340,370,GROUND)],
    cats: [[600,GROUND,350,950,2], [1400,GROUND,1180,1950,2], [1700,GROUND,1180,1950,2], [1560,270,1540,1760,1], [2400,GROUND,2200,2500,2],
           [2900,GROUND,2560,3150,8,true]],
    cheese: [[360,330],[420,330],[620,230],[690,230],[900,330],[1290,330],[1350,330],[1580,230],[1650,230],[1840,330],[2340,330],[2400,330],[1100,440],[2100,440]],
    hearts: [[640,230],[1600,230]], goal: 3100, needBoss: true },
];

/* ================= 游戏状态 ================= */
let state = 'menu', lvIdx = 0, lv, cam = 0, score = 0, cheeseCount = 0, msg = '', msgT = 0, tAll = 0, kidName = 'KK';
let P, cats = [], pies = [], cheeses = [], hearts = [], parts = [], lastSafe;
const keys = { left: 0, right: 0, up: 0, down: 0, atk: 0 };
let jumpQ = false;

function loadLevel(i, keepScore) {
  lvIdx = i; lv = LEVELS[i];
  if (!keepScore) { score = 0; cheeseCount = 0; }
  P = { x: 80, y: GROUND, vx: 0, vy: 0, face: 1, hp: 5, inv: 0, onGround: true, climb: false, lad: null, drop: 0, atkCd: 0, anim: 0, cur: null };
  lastSafe = { x: 80, y: GROUND };
  cats = lv.cats.map(c => ({ x: c[0], y: c[1], a: c[2], b: c[3], hp: c[4], max: c[4], boss: !!c[5], dir: Math.random() < .5 ? 1 : -1, hurt: 0, vy: 0, t: Math.random() * 5, s: c[5] ? 1.9 : 1, dead: 0 }));
  pies = []; parts = [];
  cheeses = lv.cheese.map(c => ({ x: c[0], y: c[1], got: false }));
  hearts = lv.hearts.map(c => ({ x: c[0], y: c[1], got: false }));
  cam = 0; showMsg(lv.name, 2.2);
  state = 'play';
}
function showMsg(t, s = 2) { msg = t; msgT = s; }
function allPlats() { return lv.ground.concat(lv.plats); }

function spawnParts(x, y, col, n = 10) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 360, vy: -Math.random() * 300, life: .6 + Math.random() * .4, col, r: 3 + Math.random() * 4 });
}
function hurtPlayer(fromX) {
  if (P.inv > 0) return;
  P.hp--; P.inv = 1.6; P.vy = -380; P.vx = (P.x < fromX ? -1 : 1) * 260; P.climb = false;
  sfx.hit(); spawnParts(P.x, P.y - 30, '#ff5a5a', 12);
  if (P.hp <= 0) { state = 'over'; }
}
function respawnAfterFall() {
  P.hp--; sfx.hit();
  if (P.hp <= 0) { state = 'over'; return; }
  P.x = lastSafe.x; P.y = lastSafe.y; P.vx = P.vy = 0; P.inv = 1.6; P.climb = false;
}

/* ================= 更新 ================= */
const SPEED = 240, JUMP = 640, G = 1700;
function update(dt) {
  tAll += dt;
  if (msgT > 0) msgT -= dt;
  if (state !== 'play') { updateParts(dt); return; }
  const k = keys, dir = (k.right ? 1 : 0) - (k.left ? 1 : 0);
  if (P.inv > 0) P.inv -= dt;
  if (P.atkCd > 0) P.atkCd -= dt;
  if (P.drop > 0) P.drop -= dt;

  if (P.climb) {
    const l = P.lad; P.vx = P.vy = 0;
    P.y += ((k.down ? 1 : 0) - (k.up ? 1 : 0)) * 150 * dt;
    if (k.up || k.down) P.anim += dt * 10;
    if (dir) P.face = dir;
    if (P.y <= l.top) { P.y = l.top; P.climb = false; P.onGround = true; }
    else if (P.y >= l.bot) { P.y = l.bot; P.climb = false; }
    else if (jumpQ) { P.climb = false; P.vy = -430; P.vx = dir * 200; P.drop = .2; sfx.jump(); }
  } else {
    const wasGround = P.onGround;
    if (P.inv > 1.2) { /* 受击硬直，保留击退速度 */ P.vx *= .96; }
    else P.vx = dir * SPEED;
    if (dir && P.inv <= 1.2) P.face = dir;
    if (k.up || k.down) {
      for (const l of lv.ladders) {
        if (Math.abs(P.x - l.x) > 16) continue;
        if (k.up && P.y > l.top + 6 && P.y <= l.bot + 4) { P.climb = true; P.lad = l; P.x = l.x; break; }
        if (k.down && wasGround && Math.abs(P.y - l.top) < 5) { P.climb = true; P.lad = l; P.x = l.x; P.y = l.top + 4; break; }
      }
    }
    if (!P.climb) {
      if (jumpQ && wasGround) {
        if (k.down && P.cur && !P.cur.ground) { P.drop = .3; P.y += 3; }
        else { P.vy = -JUMP; sfx.jump(); }
      }
      P.vy += G * dt;
      const prevY = P.y;
      P.x += P.vx * dt; P.y += P.vy * dt;
      P.onGround = false; P.cur = null;
      if (P.vy >= 0) for (const pl of allPlats()) {
        if (P.drop > 0 && !pl.ground) continue;
        if (P.x + 10 > pl.x && P.x - 10 < pl.x + pl.w && prevY <= pl.y + 2 && P.y >= pl.y) {
          P.y = pl.y; P.vy = 0; P.onGround = true; P.cur = pl; break;
        }
      }
      if (P.onGround && P.cur.ground && P.x > P.cur.x + 40 && P.x < P.cur.x + P.cur.w - 40) lastSafe = { x: P.x, y: P.y };
      if (P.onGround && dir) P.anim += dt * 14;
      if (P.y > H + 120) respawnAfterFall();
    }
  }
  P.x = Math.max(20, Math.min(lv.width - 20, P.x));
  if (k.atk && P.atkCd <= 0) {
    P.atkCd = .35; sfx.throw();
    pies.push({ x: P.x + P.face * 24, y: P.y - 38, vx: P.face * 560, life: .8, rot: 0 });
  }
  jumpQ = false;

  // 弹丸
  for (const p of pies) { p.x += p.vx * dt; p.life -= dt; p.rot += dt * 14; }
  pies = pies.filter(p => p.life > 0);

  // 猫
  for (const c of cats) {
    if (c.dead) { c.dead -= dt; continue; }
    c.t += dt; if (c.hurt > 0) c.hurt -= dt;
    const sp = c.boss ? 110 : 70;
    c.x += c.dir * sp * dt;
    if (c.x < c.a) { c.x = c.a; c.dir = 1; } if (c.x > c.b) { c.x = c.b; c.dir = -1; }
    if (c.boss) { // 汤姆会跳
      if (c.y >= GROUND && c.vy === 0 && Math.random() < dt * .5) c.vy = -700;
      if (c.vy !== 0 || c.y < GROUND) { c.vy += G * dt; c.y += c.vy * dt; if (c.y >= GROUND) { c.y = GROUND; c.vy = 0; } }
      if (Math.abs(P.x - c.x) < 500) c.dir = P.x > c.x ? 1 : -1;
    }
    // 弹丸命中
    for (const p of pies) {
      if (p.life > 0 && Math.abs(p.x - c.x) < 22 * c.s && p.y > c.y - 58 * c.s && p.y < c.y) {
        p.life = 0; hitCat(c, 1); if (c.dead) break;
      }
    }
    if (c.dead) continue;
    // 与玩家碰撞
    if (Math.abs(P.x - c.x) < 14 + 18 * c.s && P.y > c.y - 56 * c.s && P.y - 58 < c.y) {
      if (P.vy > 120 && P.y < c.y - 26 * c.s && !P.climb) {
        if (c.hurt <= 0) hitCat(c, c.boss ? 1 : 2);
        P.vy = -480; P.onGround = false;
      } else hurtPlayer(c.x);
    }
  }
  pies = pies.filter(p => p.life > 0);

  // 拾取
  for (const c of cheeses) if (!c.got && Math.abs(P.x - c.x) < 26 && Math.abs(P.y - 30 - c.y) < 40) { c.got = true; score += 10; cheeseCount++; sfx.coin(); spawnParts(c.x, c.y, '#ffcf33', 6); }
  for (const h of hearts) if (!h.got && Math.abs(P.x - h.x) < 26 && Math.abs(P.y - 30 - h.y) < 40) { h.got = true; P.hp = Math.min(5, P.hp + 1); sfx.coin(); spawnParts(h.x, h.y, '#ff5a8a', 8); }

  // 终点
  const bossAlive = lv.needBoss && cats.some(c => c.boss && !c.dead);
  if (P.x > lv.goal - 30) {
    if (bossAlive) { if (msgT <= 0) showMsg('先打败汤姆，才能拿到礼物！', 1.5); P.x = lv.goal - 31; }
    else { state = lvIdx === LEVELS.length - 1 ? 'win' : 'clear'; sfx.win(); for (let i = 0; i < 60; i++) spawnParts(P.x, P.y - 60, ['#ff5a8a', '#ffcf33', '#5ab8ff', '#7ee07e'][i % 4], 1); }
  }

  cam = Math.max(0, Math.min(lv.width - W, P.x - W / 2));
  updateParts(dt);
}
function hitCat(c, dmg) {
  c.hp -= dmg; c.hurt = .5; spawnParts(c.x, c.y - 30 * c.s, '#fff', 8);
  if (c.hp <= 0) { c.dead = .01; c.dead = .6; score += c.boss ? 300 : 50; sfx.kill(); spawnParts(c.x, c.y - 30 * c.s, '#ffcf33', 16); }
  else beep(220, .1, 'square', .06);
}
function updateParts(dt) {
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
}

/* ================= 绘制 ================= */
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (!lv) return;
  drawBackground();
  ctx.save(); ctx.translate(-Math.round(cam), 0);
  drawWorld();
  ctx.restore();
  drawHUD();
}
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, lv.sky[0]); g.addColorStop(1, lv.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const th = lv.theme;
  if (th === 'garden') {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 8; i++) { const x = ((i * 330 - cam * .2) % (W + 300) + W + 300) % (W + 300) - 150, y = 60 + (i % 3) * 50; cloud(x, y); }
    hills(cam * .35, '#9bdc8a', 380, 160); hills(cam * .6 + 200, '#6fc46a', 420, 120);
  } else if (th === 'kitchen') {
    ctx.fillStyle = '#ffd98a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffe9b8';
    const off = -(cam * .5) % 80;
    for (let x = off - 80; x < W + 80; x += 80) for (let y = 0; y < 440; y += 80) if (((x - off) / 80 + y / 80) % 2 === 0) ctx.fillRect(x, y, 80, 80);
    // 窗户
    for (let i = 0; i < 4; i++) { const x = ((i * 420 - cam * .5) % 1680 + 1680) % 1680 - 200; ctx.fillStyle = '#7ec8ff'; ctx.fillRect(x, 70, 120, 150); ctx.strokeStyle = '#7a4a2a'; ctx.lineWidth = 8; ctx.strokeRect(x, 70, 120, 150); ctx.beginPath(); ctx.moveTo(x + 60, 70); ctx.lineTo(x + 60, 220); ctx.moveTo(x, 145); ctx.lineTo(x + 120, 145); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 60; i++) { const x = ((i * 173 - cam * .1) % W + W) % W, y = (i * 91) % 300; ctx.globalAlpha = .5 + .5 * Math.sin(tAll * 2 + i); ctx.fillRect(x, y, 2, 2); }
    ctx.globalAlpha = 1;
    // 气球
    const cols = ['#ff5a8a', '#ffcf33', '#5ab8ff', '#7ee07e'];
    for (let i = 0; i < 10; i++) { const x = ((i * 260 - cam * .4) % 2600 + 2600) % 2600 - 150, y = 120 + Math.sin(tAll + i) * 14 + (i % 3) * 60; ctx.fillStyle = cols[i % 4]; ctx.beginPath(); ctx.ellipse(x, y, 22, 28, 0, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + 28); ctx.lineTo(x, y + 90); ctx.stroke(); }
    hills(cam * .3, '#4a3a8a', 400, 140);
  }
  // 彩旗
  const fc = ['#ff5a8a', '#ffcf33', '#5ab8ff', '#7ee07e'];
  ctx.strokeStyle = '#3b2a20'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 14); ctx.quadraticCurveTo(W / 2, 54, W, 14); ctx.stroke();
  for (let i = 0; i < 16; i++) {
    const t = (i + .5) / 16, x = t * W, y = 14 + 40 * 2 * t * (1 - t) + 2;
    ctx.fillStyle = fc[i % 4]; ctx.beginPath(); ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y); ctx.lineTo(x, y + 24); ctx.fill();
  }
}
function cloud(x, y) { ctx.beginPath(); ctx.arc(x, y, 26, 0, 7); ctx.arc(x + 30, y - 10, 32, 0, 7); ctx.arc(x + 64, y, 26, 0, 7); ctx.fill(); }
function hills(off, col, base, amp) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, base - amp * (.5 + .5 * Math.sin((x + off) / 160)) * .6 - 20 * Math.sin((x + off) / 55));
  ctx.lineTo(W, H); ctx.fill();
}

function drawWorld() {
  // 梯子
  for (const l of lv.ladders) {
    ctx.strokeStyle = '#8a5a30'; ctx.lineWidth = 5; ctx.beginPath();
    ctx.moveTo(l.x - 12, l.top); ctx.lineTo(l.x - 12, l.bot); ctx.moveTo(l.x + 12, l.top); ctx.lineTo(l.x + 12, l.bot); ctx.stroke();
    ctx.lineWidth = 4; ctx.beginPath();
    for (let y = l.top + 12; y < l.bot; y += 22) { ctx.moveTo(l.x - 12, y); ctx.lineTo(l.x + 12, y); } ctx.stroke();
  }
  // 地面
  for (const g of lv.ground) {
    if (g.x + g.w < cam - 20 || g.x > cam + W + 20) continue;
    ctx.fillStyle = lv.theme === 'kitchen' ? '#c98b52' : lv.theme === 'party' ? '#5b4a9a' : '#9a6a3a'; ctx.fillRect(g.x, g.y, g.w, H - g.y);
    ctx.fillStyle = lv.theme === 'kitchen' ? '#e8b878' : lv.theme === 'party' ? '#ff7ab8' : '#5fcf5a'; ctx.fillRect(g.x, g.y, g.w, 14);
    ctx.fillStyle = '#0002'; ctx.fillRect(g.x, g.y + 14, g.w, 4);
    ctx.fillStyle = '#0001'; for (let x = g.x + 20; x < g.x + g.w; x += 70) { ctx.beginPath(); ctx.arc(x, g.y + 40, 9, 0, 7); ctx.fill(); }
  }
  // 平台（奶酪块）
  for (const p of lv.plats) {
    if (p.x + p.w < cam - 20 || p.x > cam + W + 20) continue;
    ctx.fillStyle = '#ffcf33'; rr(p.x, p.y, p.w, 28, 8); ctx.fill();
    ctx.strokeStyle = '#3b2a20'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#e0a820';
    for (let x = p.x + 24; x < p.x + p.w - 10; x += 52) { ctx.beginPath(); ctx.ellipse(x, p.y + 15, 8, 6, 0, 0, 7); ctx.fill(); }
  }
  // 终点：杰瑞 + 礼物
  drawJerry(lv.goal, GROUND, tAll);
  // 奶酪、爱心
  for (const c of cheeses) if (!c.got) drawCheese(c.x, c.y + Math.sin(tAll * 4 + c.x) * 4);
  for (const h of hearts) if (!h.got) drawHeart(h.x, h.y + Math.sin(tAll * 4 + h.x) * 4);
  // 猫
  for (const c of cats) {
    if (c.dead) { ctx.globalAlpha = Math.max(0, c.dead / .6); drawTom(c.x, c.y - (0.6 - c.dead) * 80, c.dir, c.s, c.t, 1, true); ctx.globalAlpha = 1; continue; }
    drawTom(c.x, c.y, c.dir, c.s, c.t, c.hurt, false);
  }
  // 弹丸（奶油派）
  for (const p of pies) {
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = '#f3c07a'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -2, 9, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#3b2a20'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.stroke();

  // 粒子
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawCheese(x, y) {

  ctx.beginPath(); ctx.moveTo(-14, 10); ctx.lineTo(14, 10); ctx.lineTo(14, -2); ctx.lineTo(-14, -12); ctx.closePath(); ctx.fill(); ctx.stroke();

function drawHeart(x, y) {

function drawKid(p) {
  const x = p.x, y = p.y, f = p.face, moving = p.onGround && Math.abs(p.vx) > 10 || (p.climb && (keys.up || keys.down));

  ctx.beginPath(); ctx.moveTo(-11, 2); ctx.lineTo(11, 2); ctx.lineTo(0, -24); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffcf33'; ctx.beginPath(); ctx.moveTo(-6, -8); ctx.lineTo(6, -8); ctx.lineTo(3, -14); ctx.lineTo(-3, -14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5a8a'; ctx.beginPath(); ctx.arc(0, -25, 4.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();
  ctx.restore();

function drawTom(x, y, dir, s, t, hurt, dying) {

function banner(t, y) {
  ctx.fillStyle = '#2b1d16cc'; rr(W / 2 - 230, y - 26, 460, 52, 16); ctx.fill();
  ctx.fillStyle = '#ffcf33'; ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, W / 2, y); ctx.textAlign = 'left';
}
function overlay(a, b) {
  ctx.fillStyle = '#0006'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffcf33'; ctx.strokeStyle = '#2b1d16'; ctx.lineWidth = 8; ctx.font = 'bold 54px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.strokeText(a, W / 2, H / 2 - 30); ctx.fillText(a, W / 2, H / 2 - 30);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.fillText(b, W / 2, H / 2 + 30);
  ctx.textAlign = 'left';
}

/* ================= 输入 ================= */
const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down', z: 'atk', j: 'atk', Z: 'atk', J: 'atk' };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (map[e.key]) { keys[map[e.key]] = 1; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'k' || e.key === 'K') { if (!e.repeat) jumpQ = true; e.preventDefault(); }
  if (e.key === 'Enter') advance();
});
addEventListener('keyup', e => { if (map[e.key]) keys[map[e.key]] = 0; });
function advance() {
  if (state === 'over') loadLevel(lvIdx, true);
  else if (state === 'clear') loadLevel(lvIdx + 1, true);
  else if (state === 'win') { loadLevel(0, false); }
}
$('start').addEventListener('click', () => {
  kidName = $('name').value.trim() || 'KK';
  $('menu').style.display = 'none'; ac = ac || null; beep(1, .01);
  loadLevel(0, false);
});
// 触屏
if ('ontouchstart' in window) {
  $('touch').style.display = 'block';
  document.querySelectorAll('#touch .b').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); if (k === 'jump') jumpQ = true; else keys[k] = 1; };
    const off = e => { e.preventDefault(); if (k !== 'jump') keys[k] = 0; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
  cv.addEventListener('pointerdown', () => advance());
  // 补充一个下按钮
  const d = document.querySelector('#touch .b[data-k=down]'); d.style.display = 'flex'; d.style.bottom = '14px'; d.style.left = '50px'; d.style.display = 'none';
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 调试/测试钩子
window.__game = { get P() { return P; }, get cats() { return cats; }, get state() { return state; }, loadLevel, keys, jump: () => { jumpQ = true; }, start: () => $('start').click() };
})();
</script>
